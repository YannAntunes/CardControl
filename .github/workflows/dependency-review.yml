name: Dependency Review

on:
  pull_request:
    branches:
      - main

# Enable the Dependency Graph under Settings > Code security and analysis,
# then define the repository variable DEPENDENCY_GRAPH_ENABLED=true to activate
# these jobs. They are skipped safely while the feature is disabled.
permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
