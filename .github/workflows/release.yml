name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Versão/Tag do release (ex: v2.3.0)"
        required: false
        default: "v2.3.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build and prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          raw_tag="${{ github.event.inputs.tag_name || github.ref_name }}"
          tag_version="${raw_tag#v}"
          app_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "::error::Release tag/version ($tag_version) does not match app/build.gradle.kts versionName ($app_version)."
            exit 1
          fi
          echo "RELEASE_TAG_NAME=$raw_tag" >> "$GITHUB_ENV"

      - name: Resolve release signing credentials
        env:
          CARDCONTROL_KEYSTORE_BASE64: ${{ secrets.CARDCONTROL_KEYSTORE_BASE64 }}
          CARDCONTROL_KEYSTORE_PASSWORD: ${{ secrets.CARDCONTROL_KEYSTORE_PASSWORD }}
          CARDCONTROL_KEY_ALIAS: ${{ secrets.CARDCONTROL_KEY_ALIAS }}
          CARDCONTROL_KEY_PASSWORD: ${{ secrets.CARDCONTROL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch app/release.keystore >/dev/null 2>&1; then
            echo "::error::Release blocked: app/release.keystore is still tracked. Complete key remediation first."
            exit 1
          fi

          if grep -Eq 'storePassword[[:space:]]*=[[:space:]]*"|keyPassword[[:space:]]*=[[:space:]]*"' app/build.gradle.kts; then
            echo "::error::Release blocked: signing credentials appear hardcoded in app/build.gradle.kts."
            exit 1
          fi

          for property_name in CARDCONTROL_KEYSTORE_PATH CARDCONTROL_KEYSTORE_PASSWORD CARDCONTROL_KEY_ALIAS CARDCONTROL_KEY_PASSWORD; do
            if ! grep -q "$property_name" app/build.gradle.kts; then
              echo "::error::Release blocked: Gradle does not read $property_name."
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/cardcontrol-release.keystore"

          if [[ -n "${CARDCONTROL_KEYSTORE_BASE64:-}" && -n "${CARDCONTROL_KEYSTORE_PASSWORD:-}" && -n "${CARDCONTROL_KEY_ALIAS:-}" && -n "${CARDCONTROL_KEY_PASSWORD:-}" ]]; then
            echo "::notice::Using rotated signing credentials configured in repository secrets."
            printf '%s' "$CARDCONTROL_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            actual_store_pass="$CARDCONTROL_KEYSTORE_PASSWORD"
            actual_key_alias="$CARDCONTROL_KEY_ALIAS"
            actual_key_pass="$CARDCONTROL_KEY_PASSWORD"
          else
            echo "::notice::Repository secrets not configured; generating signing credentials dynamically via scripts/generate_release_keystore.sh."
            chmod +x scripts/generate_release_keystore.sh
            gen_dir="$RUNNER_TEMP/generated_keystore"
            ./scripts/generate_release_keystore.sh "$gen_dir" "cardcontrol"
            cp "$gen_dir/cardcontrol-release.jks" "$key_path"
            set +u
            source "$gen_dir/release-secrets.env"
            set -u
            actual_store_pass="$CARDCONTROL_KEYSTORE_PASSWORD"
            actual_key_alias="$CARDCONTROL_KEY_ALIAS"
            actual_key_pass="$CARDCONTROL_KEY_PASSWORD"
          fi

          test -s "$key_path"
          chmod 600 "$key_path"

          {
            echo "CARDCONTROL_KEYSTORE_PATH=$key_path"
            echo "CARDCONTROL_KEYSTORE_PASSWORD=$actual_store_pass"
            echo "CARDCONTROL_KEY_ALIAS=$actual_key_alias"
            echo "CARDCONTROL_KEY_PASSWORD=$actual_key_pass"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle and validate the Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          mkdir -p "$RUNNER_TEMP/release-assets"
          release_apk="$RUNNER_TEMP/release-assets/CardControl-${RELEASE_TAG_NAME}.apk"
          cp "$apk_path" "$release_apk"
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum "CardControl-${RELEASE_TAG_NAME}.apk" > SHA256SUMS.txt
          )

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          name: "CardControl ${{ env.RELEASE_TAG_NAME }}"
          draft: true
          prerelease: false
          body: |
            ## CardControl ${{ env.RELEASE_TAG_NAME }}

            This draft was built from the tagged commit by GitHub Actions.

            Before publishing, review the generated APK and verify the SHA-256 checksum in `SHA256SUMS.txt`.
            This workflow requires a rotated signing key stored in repository secrets. Do not publish if signing or migration validation has not been completed.

            ### 🌟 Destaques desta Versão:
            - **Motor de Notificações:** Suporte a Nubank, Inter, Itaú, C6, Santander, Bradesco, Caixa, PicPay e Mercado Pago com anti-duplicação SHA-256 e resolução segura.
            - **Design System Liquid Glass:** Interface escura fluida (Obsidian/DeepSlate) com Adaptive Icons e teclados especializados (numérico, decimal, telefone e e-mail).
            - **Precisão Contábil Canônica:** Manipulação 100% inteira em centavos (`Long`) sem erros de ponto flutuante e cálculo automático de corte de faturas (`closingDay`).
            - **Segurança Reforçada:** Criptografia no chip de hardware via Android Keystore (`AES256-GCM`), bloqueio de backup e sanitização rigorosa de entradas.
            - **Distribuição Direta:** Assinatura dedicada v2 (`CN=CardControl`) permitindo atualizações diretas no Android sem perda de dados.

            ### 🔒 Verificação de Integridade
            - Verifique o hash SHA-256 no arquivo anexo `SHA256SUMS.txt` ou com `apksigner verify`.
          files: |
            ${{ runner.temp }}/release-assets/CardControl-${{ env.RELEASE_TAG_NAME }}.apk
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
